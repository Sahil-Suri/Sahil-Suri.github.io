<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canvass Demo</title>
    <style>
        body {
            font: 16px/1.5 sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 0 16px;
        }

        nav, .actions {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }

        section {
            margin-top: 24px;
        }

        label {
            display: block;
            margin: 12px 0;
        }

        input:not([type="checkbox"]), select, textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        .item {
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <h1>Canvass Demo</h1>
    <nav>
        <button type="button" onclick="showPage('forms')">Forms</button>
        <button type="button" onclick="showPage('buildings')">Buildings</button>
        <button type="button" onclick="showPage('canvass')">Canvass</button>
    </nav>

    <section id="forms">
        <h2>Form Maker</h2>
        <form id="formMaker">
            <label>Form name <input id="formName" required></label>
            <div class="actions">
                <button type="button" onclick="addQuestion('checkbox')">Add checkbox</button>
                <button type="button" onclick="addQuestion('notes')">Add notes box</button>
            </div>
            <div id="questionEditor"></div>
            <button>Save form</button>
        </form>
        <h3>Forms</h3>
        <div id="formList"></div>
    </section>

    <section id="buildings" hidden>
        <h2>Building Maker</h2>
        <form id="buildingMaker">
            <label>Address <input id="buildingAddress" required></label>
            <button>Create building</button>
        </form>
        <h3>Buildings</h3>
        <div id="buildingList"></div>
    </section>

    <section id="canvass" hidden>
        <h2>Canvass</h2>
        <label>Building <select id="buildingSelect"></select></label>
        <label>Form <select id="formSelect"></select></label>
        <form id="visitMaker">
            <label>1. Unit / door <input id="unitName" required placeholder="e.g. 2B"></label>
            <label>2. Knocked on door? <input id="knocked" type="checkbox"></label>
            <div id="visitQuestions"></div>
            <button>Save visit</button>
        </form>
        <h3>Visits</h3>
        <div id="visitList"></div>
    </section>

    <script>
        const forms = [];
        const buildings = [{ id: 1, address: '1 Fidelis Way, Boston, MA', units: [] }];
        const visits = [];
        let questions = [];
        let nextId = 2;

        const $ = id => document.getElementById(id);

        function showPage(page) {
            for (const section of document.querySelectorAll('section')) {
                section.hidden = section.id !== page;
            }
        }

        function addQuestion(type) {
            const question = { id: nextId++, type, name: '' };
            questions.push(question);
            drawQuestionEditor();
        }

        function drawQuestionEditor() {
            $('questionEditor').replaceChildren();

            for (const question of questions) {
                const row = document.createElement('div');
                row.className = 'item';

                const label = document.createElement('label');
                label.textContent = question.type === 'checkbox' ? 'Checkbox question' : 'Notes question';

                const input = document.createElement('input');
                input.required = true;
                input.value = question.name;
                input.oninput = () => question.name = input.value;
                label.append(input);

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.textContent = 'Remove';
                remove.onclick = () => {
                    questions = questions.filter(item => item.id !== question.id);
                    drawQuestionEditor();
                };

                row.append(label, remove);
                $('questionEditor').append(row);
            }
        }

        $('formMaker').onsubmit = event => {
            event.preventDefault();

            forms.push({
                id: nextId++,
                name: $('formName').value.trim(),
                questions: questions.map(question => ({ ...question }))
            });

            questions = [];
            $('formMaker').reset();
            drawQuestionEditor();
            refresh();
        };

        $('buildingMaker').onsubmit = event => {
            event.preventDefault();

            buildings.push({
                id: nextId++,
                address: $('buildingAddress').value.trim(),
                units: []
            });

            $('buildingMaker').reset();
            refresh();
        };

        function fillSelect(id, items, label) {
            const select = $(id);
            const previous = select.value;
            select.replaceChildren();

            for (const item of items) {
                select.add(new Option(item[label], item.id));
            }

            if (items.some(item => String(item.id) === previous)) {
                select.value = previous;
            }
        }

        function drawVisitQuestions() {
            const form = forms.find(item => item.id === Number($('formSelect').value));
            $('visitQuestions').replaceChildren();

            for (const question of form?.questions || []) {
                const label = document.createElement('label');
                label.textContent = question.name;

                const input = document.createElement(question.type === 'checkbox' ? 'input' : 'textarea');
                if (question.type === 'checkbox') {
                    input.type = 'checkbox';
                }
                input.dataset.question = question.id;
                label.append(input);
                $('visitQuestions').append(label);
            }
        }

        $('formSelect').onchange = drawVisitQuestions;
        $('buildingSelect').onchange = drawVisits;

        $('visitMaker').onsubmit = event => {
            event.preventDefault();

            const building = buildings.find(item => item.id === Number($('buildingSelect').value));
            const form = forms.find(item => item.id === Number($('formSelect').value));

            if (!building || !form) {
                alert('Create and select a form and building first.');
                return;
            }

            const unit = $('unitName').value.trim();
            if (!unit) return;

            if (!building.units.includes(unit)) {
                building.units.push(unit);
            }

            const answers = {};
            for (const question of form.questions) {
                const input = $('visitQuestions').querySelector(`[data-question="${question.id}"]`);
                answers[question.name] = question.type === 'checkbox' ? input.checked : input.value;
            }

            visits.push({
                buildingId: building.id,
                formName: form.name,
                unit,
                knocked: $('knocked').checked,
                answers
            });

            $('visitMaker').reset();
            drawVisitQuestions();
            refresh();
        };

        function drawVisits() {
            $('visitList').replaceChildren();
            const buildingId = Number($('buildingSelect').value);

            for (const visit of visits.filter(item => item.buildingId === buildingId)) {
                const row = document.createElement('div');
                row.className = 'item';

                const heading = document.createElement('strong');
                heading.textContent = `${visit.unit} · ${visit.formName} · ${visit.knocked ? 'Knocked' : 'Not knocked'}`;
                row.append(heading);

                for (const [name, answer] of Object.entries(visit.answers)) {
                    const detail = document.createElement('div');
                    detail.textContent = `${name}: ${typeof answer === 'boolean' ? (answer ? 'Yes' : 'No') : answer}`;
                    row.append(detail);
                }

                $('visitList').append(row);
            }
        }

        function refresh() {
            $('formList').replaceChildren();
            for (const form of forms) {
                const row = document.createElement('div');
                row.textContent = `${form.name} (${form.questions.length} questions)`;
                $('formList').append(row);
            }

            $('buildingList').replaceChildren();
            for (const building of buildings) {
                const row = document.createElement('div');
                row.textContent = `${building.address} (${building.units.join(', ') || 'no units'})`;
                $('buildingList').append(row);
            }

            fillSelect('buildingSelect', buildings, 'address');
            fillSelect('formSelect', forms, 'name');
            drawVisitQuestions();
            drawVisits();
        }

        refresh();
    </script>
</body>
</html>
